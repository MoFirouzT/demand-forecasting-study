[project]
name = "dfstudy"
version = "0.1.0"
description = "A study of demand forecasting methods on public and synthetic retail data."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis",
    "import-linter",
    "pytest",
]
docs = [
    "mkdocs-material",
]
data = [
    "huggingface-hub",
    "kaggle",
    "six",  # kaggle imports it without declaring it
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# A model must not reach the scoring or test-window code, and the scorer must not depend on
# any model: the evaluation is an independent reading of every model's output.
[tool.importlinter]
root_packages = ["dfstudy"]

[[tool.importlinter.contracts]]
name = "Evaluation and models never import each other"
type = "independence"
modules = ["dfstudy.evaluation", "dfstudy.models"]
